{% extends 'expenses/base.html' %}

{% block title %}Edit Fee Rate{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-12 col-lg-7">
        <div class="card card-clean">
            <div class="card-body p-4">
                <h2 class="section-title mb-3">Edit Fee Rate</h2>
                <form method="post" class="row g-3">
                    {% csrf_token %}
                    <div class="col-md-6">
                        <label class="form-label" for="{{ form.year.id_for_label }}">Year</label>
                        {{ form.year }}
                    </div>
                    <div class="col-md-6">
                        <label class="form-label" for="{{ form.fee_type.id_for_label }}">Fee Type</label>
                        {{ form.fee_type }}
                    </div>
                    <div class="col-md-6">
                        <label class="form-label" for="{{ form.quantity_included.id_for_label }}">Included Quantity</label>
                        {{ form.quantity_included }}
                    </div>
                    <div class="col-md-6">
                        <label class="form-label" for="{{ form.unit_price.id_for_label }}">Unit Price</label>
                        {{ form.unit_price }}
                    </div>
                    <div class="col-12 form-actions-mobile pt-2">
                        <button type="submit" class="btn btn-primary">Save</button>
                        <a href="{% url 'dashboard' %}?tab=Fees" class="btn btn-outline-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
